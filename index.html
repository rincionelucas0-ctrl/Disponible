<body><noscript><div style="padding:20px;font-family:system-ui">DISPONIBLE necesita JavaScript activado para funcionar.</div></noscript>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.DISPONIBLE_CONFIG={supabaseUrl:'https://beusduytgbsxbypaskxn.supabase.co',supabaseKey:'sb_publishable_HrRPDoXkFVHYA97BYExBfw_RKMdjPL_'};</script>
<script>
/* DISPONIBLE — Frontend integrado con Supabase (fase D). */
const app=document.querySelector('#app');
const sb=window.supabase?.createClient?.(window.DISPONIBLE_CONFIG.supabaseUrl,window.DISPONIBLE_CONFIG.supabaseKey);
let authReady=false;
let authError='';
let authSyncPromise=null;
let authSyncVersion=0;
async function syncAuth(){
  if(authSyncPromise)return authSyncPromise;
  const version=++authSyncVersion;
  authSyncPromise=(async()=>{
    if(!sb){authReady=true;authError='Supabase no está configurado.';return;}
    try{
      const {data:sessionData,error:sessionError}=await sb.auth.getSession();
      if(sessionError)throw sessionError;
      const session=sessionData?.session;
      if(!session){
        state.authUser=null;state.role=null;state.accountStatus='active';state.screen='home';
        state.realWorkers=[];state.savedWorkers=[];state.favorites=[];state.notifications=[];
        authError='';authReady=true;return;
      }
      const {data:userRow,error:userError}=await sb.from('users').select('role,status').eq('id',session.user.id).maybeSingle();
      if(userError)throw userError;
      if(version!==authSyncVersion)return;
      state.authUser=session.user;
      if(!userRow){state.role=null;authError='Tu acceso de Google se completó, pero falta crear tu registro de DISPONIBLE. No vuelvas a registrarte; hay que revisar la sincronización de la cuenta.';authReady=true;return;}
      state.role=userRow.role||null;
      state.accountStatus=userRow.status||'active';
      authError='';authReady=true;
      if(state.role==='admin'){location.replace('/admin.html');return;}
      if(state.accountStatus!=='active')return;
      await loadCatalogs();
      if(version!==authSyncVersion)return;
      if(state.role==='worker')await loadWorkerProfile();
      if(state.role==='business'){await loadBusinessProfile();await loadBusinessFavorites();await loadSavedWorkers();}
      await loadNotifications();
    }catch(error){
      console.error('Error al sincronizar autenticación DISPONIBLE:',error);
      if(version!==authSyncVersion)return;
      state.role=null;
      authError=error?.message?`No pudimos cargar tu cuenta: ${error.message}`:'No pudimos verificar tu sesión. Revisá tu conexión e intentá ingresar de nuevo.';
      authReady=true;
    }
  })();
  try{return await authSyncPromise;}finally{authSyncPromise=null;}
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const jsArg=s=>esc(JSON.stringify(String(s??'')));
const toast=m=>{const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.append(x);setTimeout(()=>x.remove(),2600)};

const catalogs={provinces:[],cities:[],zones:[],categories:[],skills:[]};
async function loadCatalogs(){if(!sb||!state.authUser)return;const [p,c,z,cat,sk]=await Promise.all([sb.from('provinces').select('id,name,is_active').eq('is_active',true).order('name'),sb.from('cities').select('id,name,province_id,status').neq('status','disabled').order('name'),sb.from('zones').select('id,name,city_id,status').neq('status','disabled').order('name'),sb.from('categories').select('id,name,is_active').eq('is_active',true).order('name'),sb.from('skills').select('id,name,category_id,is_active').eq('is_active',true).order('name')]);catalogs.provinces=p.data||[];catalogs.cities=c.data||[];catalogs.zones=z.data||[];catalogs.categories=cat.data||[];catalogs.skills=sk.data||[];}
const optionList=(items,value='',placeholder='Elegir')=>`<option value="">${esc(placeholder)}</option>${items.map(x=>`<option value="${esc(x.id)}" ${x.id===value?'selected':''}>${esc(x.name)}</option>`).join('')}`;
const selectedId=(items,name)=>items.find(x=>x.name?.toLowerCase()===String(name||'').toLowerCase())?.id||'';
function citiesForProvince(id){return catalogs.cities.filter(x=>!id||x.province_id===id)}
function zonesForCity(id){return catalogs.zones.filter(x=>!id||x.city_id===id)}
const state={authUser:null,accountStatus:'active',role:null,screen:'home',worker:{name:'',surname:'',bio:'',experience:'',province:'',city:'',zone:'',category:'',skills:[],mobility:'',photo:'',contact:true,availability:'No disponible',completion:0},business:{name:'',category:'',description:'',province:'',city:'',zone:'',address:'',website:'',instagram:'',hours:'',logo:'',contact:true,status:'active',completion:0,rating:0,reviews:0},favorites:[],notifications:[],filters:{availability:'',category:'',province:'',city:'',zone:'',experience:'',mobility:'',skill:''},searchQuery:''};
function nav(items,active){return `<nav class="bottom-nav" style="--nav-count:${items.length}">${items.map(i=>`<button class="nav-item ${active===i.key?'active':''}" onclick="navigate('${i.key}')"><span>${i.icon}</span><small>${i.label}</small></button>`).join('')}</nav>`}
function header(title='',sub=''){return `<header class="app-header"><button class="icon-btn" onclick="goBack()">‹</button><div><strong>${esc(title)}</strong>${sub?`<small>${esc(sub)}</small>`:''}</div><button class="icon-btn" onclick="openMenu()">⋯</button></header>`}
function shell(content,bottom=true){const items=state.role==='worker'?[{key:'home',icon:'⌂',label:'Inicio'},{key:'search',icon:'⌕',label:'Explorar'},{key:'notifications',icon:'♢',label:'Avisos'},{key:'profile',icon:'●',label:'Perfil'}]:[{key:'home',icon:'⌂',label:'Inicio'},{key:'search',icon:'⌕',label:'Buscar'},{key:'saved',icon:'♡',label:'Candidatos'},{key:'notifications',icon:'♢',label:'Avisos'},{key:'profile',icon:'●',label:'Perfil'}];return `<div class="app-shell"><div class="topbar"><div class="brand">DISPONIBLE<span>.</span></div><button class="icon-btn" aria-label="Abrir menú" onclick="openMenu()">☰</button></div><main class="page">${content}</main>${bottom?nav(items,state.screen):''}</div>`}
function render(){if(!authReady){app.innerHTML=`<div class=\"landing\"><div class=\"landing-inner\"><div class=\"brand big\">DISPONIBLE<span>.</span></div><p>Verificando tu sesión…</p></div></div>`;return;}if(authError){app.innerHTML=`<div class="landing"><div class="landing-inner"><div class="brand big">DISPONIBLE<span>.</span></div><h1>No pudimos completar el ingreso</h1><p>${esc(authError)}</p><button class="primary full" onclick="logout();showLogin()">Volver a ingresar</button><button class="secondary full" onclick="logout()">Cerrar sesión</button></div></div>`;return;}if(state.authUser&&state.accountStatus!=='active'){const paused=state.accountStatus==='paused';app.innerHTML=`<div class="landing"><div class="landing-inner"><div class="brand big">DISPONIBLE<span>.</span></div><h1>${paused?'Tu cuenta está pausada':'Tu cuenta no está activa'}</h1><p>${paused?'Podés reactivarla cuando quieras para volver a usar DISPONIBLE.':'El acceso está limitado por el estado actual de tu cuenta. Si creés que es un error, contactá al equipo de DISPONIBLE.'}</p>${paused?'<button class="primary full" onclick="resumeAccount()">Reactivar cuenta</button>':''}<button class="secondary full" onclick="logout()">Cerrar sesión</button></div></div>`;return;}if(!state.role)return renderLanding();if(state.role==='admin'){location.replace('/admin.html');return;}if(state.role!=='worker'&&state.role!=='business'){app.innerHTML='<div class="landing"><div class="landing-inner"><h1>Tipo de cuenta no válido</h1><p>Contactá al soporte de DISPONIBLE.</p><button class="secondary full" onclick="logout()">Cerrar sesión</button></div></div>';return;}if(state.screen==='profile')return renderProfile();if(state.screen==='notifications')return renderNotifications();if(state.screen==='saved')return renderSaved();if(state.role==='business'&&state.screen==='search')return renderSearch();if(state.role==='worker'&&state.screen==='search')return renderWorkerDiscover();return state.role==='worker'?renderWorkerHome():renderBusinessHome()}
function renderLanding(){
 const hasSession=Boolean(state.authUser);
 const actions=hasSession
  ? `<div class="hero-copy"><div class="eyebrow">UN PASO MÁS</div><h1>¿Cómo querés usar <span>DISPONIBLE?</span></h1><p>Elegí tu perfil. Lo vas a poder usar cada vez que ingreses.</p></div><div class="landing-actions"><button class="primary huge" onclick="selectRole('worker')">🧑‍🔧 Soy trabajador <small>Quiero mostrar que estoy disponible</small></button><button class="secondary huge" onclick="selectRole('business')">🏪 Necesito personal <small>Quiero encontrar personas</small></button></div><button class="link-btn" onclick="logout()">Cerrar sesión</button>`
  : `<div class="hero-copy"><div class="eyebrow">PERSONAS DISPONIBLES · NEGOCIOS QUE NECESITAN GENTE</div><h1>¿Estás disponible?<br><span>Mostrate.</span></h1><p>Hacé visible tu disponibilidad. O encontrá rápido a la persona que necesitás.</p></div><div class="landing-actions"><button class="primary huge" onclick="showLogin()">Comenzar con Google <small>Ingresá o creá tu cuenta gratis</small></button></div><button class="link-btn" onclick="showLogin()">Ya tengo una cuenta · Ingresar</button><div class="trust-row"><span>🔒 Privado</span><span>⚡ Rápido</span><span>📍 Por zona</span></div>`;
 app.innerHTML=`<div class="landing"><div class="landing-inner"><div class="brand big">DISPONIBLE<span>.</span></div>${actions}</div></div>`;
}
async function selectRole(role){
 if(!['worker','business'].includes(role))return toast('Tipo de cuenta no válido');
 if(!sb)return toast('Supabase no está configurado');
 if(!state.authUser){showLogin();return;}
 if(state.accountStatus!=='active')return toast('Tu cuenta no está activa.');
 if(state.role==='admin'){location.replace('/admin.html');return;}
 if(state.role===role){state.screen='home';render();return;}
 if(state.role&&state.role!==role)return toast('Tu cuenta ya tiene un perfil asignado. Para cambiarlo, contactá al soporte.');
 if(window._choosingRole)return;
 window._choosingRole=true;
 const buttons=[...document.querySelectorAll('.landing-actions button')];
 const setBusy=busy=>buttons.forEach(b=>{b.disabled=busy;if(busy)b.setAttribute('aria-busy','true');else b.removeAttribute('aria-busy')});
 setBusy(true);
 try{
  const {error}=await sb.rpc('choose_my_role',{p_role:role});
  if(error){
   console.error('No se pudo asignar el rol:',error);
   await syncAuth();
   if(!authError&&state.role===role){state.screen='home';render();return;}
   if(state.role==='admin'){location.replace('/admin.html');return;}
   if(authError){render();return;}
   const message=String(error.message||'');
   if(message.includes('role_already_selected')){
    toast('Esta cuenta ya tiene un rol asignado o todavía no se sincronizó. Cerrá sesión y volvé a ingresar.');
    render();return;
   }
   toast('No pudimos guardar tu tipo de cuenta. '+(error.message||'Revisá tu conexión e intentá otra vez.'));
   return;
  }
  await syncAuth();
  if(state.role==='admin'){location.replace('/admin.html');return;}
  if(authError){render();return;}
  if(state.role!==role){
   toast('Guardamos la elección, pero todavía no pudimos confirmarla. Esperá un momento y volvé a intentarlo.');
   render();return;
  }
  state.screen='home';
  render();
  toast(role==='worker'?'Perfil de trabajador iniciado':'Perfil de negocio iniciado');
 }catch(e){
  console.error('Error inesperado al elegir perfil:',e);
  toast('Ocurrió un error al crear tu perfil. Podés volver a intentarlo.');
 }finally{
  window._choosingRole=false;
  setBusy(false);
 }
}
function showLogin(){openModal('Ingresar a DISPONIBLE',`<p class="muted">Ingresá con tu cuenta de Google.</p><button class="primary full" onclick="googleLogin()">Continuar con Google</button><button class="secondary full" onclick="closeModal()">Cerrar</button>`)}
async function googleLogin(){if(!sb)return toast('Supabase no está configurado');const redirectTo=new URL('/',location.origin).toString();const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo}});if(error)toast('No pudimos iniciar sesión con Google: '+error.message)}
async function logout(){if(sb)await sb.auth.signOut();state.authUser=null;state.role=null;state.accountStatus='active';authError='';state.realWorkers=[];state.savedWorkers=[];state.favorites=[];state.notifications=[];render();toast('Sesión cerrada')}

function renderWorkerHome(){return shell(`<section class="welcome"><div><span class="eyebrow">MI DISPONIBILIDAD</span><h1>Hola${state.worker.name?' '+esc(state.worker.name):''} 👋</h1><p>Tu disponibilidad es lo primero que ven los negocios.</p></div><div class="availability-pill ${state.worker.availability!=='No disponible'?'on':''}"><i></i>${esc(state.worker.availability)}</div></section><section class="availability-card"><div><span class="eyebrow">ESTADO</span><h2>${state.worker.availability==='No disponible'?'¿Estás disponible?':'Estás visible para negocios'}</h2><p>${state.worker.availability==='No disponible'?'Activá tu disponibilidad para aparecer en búsquedas.':'Podés cambiar o desactivar tu disponibilidad cuando quieras.'}</p></div><button class="primary" onclick="openAvailability()">${state.worker.availability==='No disponible'?'Estoy disponible':'Gestionar'}</button></section><section class="section-title"><div><span class="eyebrow">TU PERFIL</span><h2>Completalo y destacate</h2></div><strong>${state.worker.completion}%</strong></section><div class="progress"><span style="width:${state.worker.completion}%"></span></div><div class="grid two"><button class="feature-card" onclick="navigate('profile')"><b>👤 Perfil</b><span>Datos, experiencia, skills y movilidad</span><em>Editar →</em></button><button class="feature-card" onclick="openBoost()"><b>🚀 Destacarme</b><span>Boost de 24 h o 7 días</span><em>Ver opciones →</em></button></div><section class="section-title"><div><span class="eyebrow">ACTIVIDAD</span><h2>Lo importante</h2></div></section><div class="grid two"><button class="feature-card" onclick="navigate('notifications')"><b>🔔 Notificaciones</b><span>${state.notifications.filter(n=>n.unread).length} sin leer</span><em>Ver avisos →</em></button><button class="feature-card" onclick="openReputation()"><b>⭐ Reputación</b><span>Mostrá la experiencia real de quienes trabajaron con vos</span><em>Ver reputación →</em></button></div>`,true)}
function renderBusinessHome(){const rec=(state.realWorkers||[]).slice(0,2);const filterCount=Object.values(state.filters).filter(Boolean).length;return shell(`<section class="welcome"><div><span class="eyebrow">BUSCAR PERSONAL</span><h1>Encontrá a la persona que necesitás.</h1><p>Filtrá por disponibilidad, zona, experiencia, categoría y movilidad.</p></div></section><div class="search-main"><div class="search-input"><span>⌕</span><input id="quick-search" placeholder="Ej.: mozo, limpieza, repositor..."><button onclick="runSearch()">Buscar</button></div><button class="filter-trigger" onclick="openFilters()">☷ Filtros <span id="filter-count">${filterCount||''}</span></button></div><section class="section-title"><div><span class="eyebrow">ACCESOS</span><h2>Encontrá rápido</h2></div></section><div class="grid two"><button class="feature-card" onclick="runSearch('now')"><b>🟢 Disponibles ahora</b><span>Personas listas para trabajar</span><em>Buscar →</em></button><button class="feature-card" onclick="navigate('saved')"><b>♡ Mis candidatos</b><span>Perfiles que guardaste</span><em>Ver guardados →</em></button></div><div class="grid two"><button class="feature-card" onclick="openReputation()"><b>⭐ Reputación</b><span>${state.business.reviews?`${state.business.rating.toFixed(1)} · ${state.business.reviews} reseñas`:'Todavía sin reseñas'}</span><em>Ver reputación →</em></button><button class="feature-card" onclick="navigate('profile')"><b>🏪 Mi negocio</b><span>${state.business.completion}% completo</span><em>Completar →</em></button></div><section class="section-title"><div><span class="eyebrow">RECOMENDADOS</span><h2>${rec.length?'Personas encontradas':'Buscá personas'}</h2></div><button class="text-btn" onclick="runSearch()">Ver todos</button></section><div class="cards-list">${rec.map(workerCard).join('')||empty('Todavía no hay recomendaciones','Usá el buscador para encontrar personas disponibles.')}</div>`,true)}
function renderSearch(){const list=filterWorkers(state.realWorkers||[]);return shell(`${header('Encontrar personas','Resultados según tus filtros')}<div class="search-input compact"><span>⌕</span><input id="search-q" value="${esc(state.searchQuery||'')}" placeholder="Buscar por profesión o skill"><button onclick="runSearch()">Buscar</button></div><div class="chips"><button onclick="openFilters()">☷ Filtros</button>${state.filters.availability?`<span>${state.filters.availability} ×</span>`:''}${state.filters.category?`<span>${state.filters.category} ×</span>`:''}</div><p class="muted small">${list.length} personas encontradas</p><div class="cards-list">${list.map(workerCard).join('')||empty('No encontramos personas','Probá con otros términos o filtros.')}</div>`,true)}
function renderWorkerDiscover(){return shell(`${header('Explorar','Prepará tu perfil para recibir oportunidades')}<div class="info-card"><b>Tu perfil define tus coincidencias.</b><p>Los negocios encontrarán tu perfil según categoría, habilidades, disponibilidad, zona y movilidad.</p><button class="primary" onclick="navigate('profile')">Completar perfil</button></div><div class="section-title"><div><span class="eyebrow">VISIBILIDAD</span><h2>Cómo aparecer mejor</h2></div></div><div class="grid two"><div class="feature-card static"><b>🟢 Disponibilidad</b><span>${esc(state.worker.availability)}</span></div><div class="feature-card static"><b>📊 Perfil</b><span>${state.worker.completion}% completo</span></div></div><div class="info-card"><b>Privacidad</b><p>Tu dirección exacta no se publica. Los negocios ven únicamente tu zona aproximada.</p></div>`,true)}
function workerCard(w){const saved=state.favorites.includes(w.id);return `<article class="worker-card"><div class="worker-top"><div class="avatar">${w.initial}</div><div class="worker-main"><div class="worker-name"><h3>${esc(w.name)}</h3>${w.featured?'<span class="featured">DESTACADO</span>':''}</div><span class="available-text">● ${esc(w.availability)}</span><p>${esc(w.category)} · ${esc(w.zone)}</p></div><button class="save-btn ${saved?'saved':''}" onclick="toggleFavorite('${w.id}')">${saved?'♥':'♡'}</button></div><div class="worker-tags">${w.skills.map(s=>`<span>${esc(s)}</span>`).join('')}<span>${esc(w.mobility)}</span></div><div class="worker-meta"><span>⭐ ${esc(w.rating)} ${w.reviews?`(${w.reviews})`:''}</span><span>${esc(w.experience)}</span></div><div class="card-actions"><button class="secondary" onclick="viewWorker('${w.id}')">Ver perfil</button><button class="primary" onclick="contactWorker('${w.id}')">Contactar</button></div></article>`}
function renderSaved(){const saved=state.savedWorkers||[];return shell(`${header('Mis candidatos','Perfiles guardados')}<div class="cards-list">${saved.map(workerCard).join('')||empty('Todavía no guardaste candidatos','Cuando encuentres a alguien interesante, tocá ♡ para guardarlo.')}</div>`,true)}
function renderNotifications(){const items=state.notifications.length?state.notifications.map((n,i)=>`<button class="notification ${n.unread?'unread':''}" onclick="readNotification(${i})"><span class="notif-dot"></span><div><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small>${esc(n.time)}</small></div></button>`).join(''):empty('No tenés avisos todavía','Acá aparecerán contactos, reseñas y otros eventos importantes.');return shell(`${header('Notificaciones','Todo lo importante en un solo lugar')}<div class="notif-actions"><button class="text-btn" onclick="markAllRead()">Marcar todo como leído</button></div><div class="cards-list">${items}</div>`,true)}
function renderProfile(){const p=state.role==='worker'?state.worker:state.business;const avatar=p.photo||p.logo;return shell(`${header('Mi perfil','Configuración y datos de cuenta')}<div class="profile-cover"><div class="big-avatar">${avatar?`<img src="${esc(avatar)}" alt="Foto de perfil">`:state.role==='worker'?'👤':'🏪'}</div><div><span class="eyebrow">CUENTA ${state.role==='worker'?'TRABAJADOR':'NEGOCIO'}</span><h2>${esc(state.role==='worker'?(p.name||'Tu nombre'):(p.name||'Tu negocio'))}</h2><p class="muted">Perfil ${state.role==='worker'?p.completion+'% completo':p.completion+'% completo'}</p></div></div><div class="profile-menu"><button onclick="state.role==='worker'?openWorkerProfile():openBusinessProfile()"><span>✎</span><div><b>Editar perfil</b><small>Información que ven otros usuarios</small></div><i>›</i></button><button onclick="openAccountSettings()"><span>⚙</span><div><b>Cuenta y privacidad</b><small>Contacto, privacidad y estado de cuenta</small></div><i>›</i></button><button onclick="openSafety()"><span>🛡</span><div><b>Seguridad y reportes</b><small>Bloqueos, reportes y ayuda</small></div><i>›</i></button><button onclick="openTerms()"><span>ⓘ</span><div><b>Términos y privacidad</b><small>Cómo funciona DISPONIBLE</small></div><i>›</i></button><button class="danger-row" onclick="confirmDelete()"><span>⌫</span><div><b>Eliminar cuenta</b><small>Esta acción requiere confirmación</small></div><i>›</i></button></div>`,true)}
async function openWorkerProfile(){await loadCatalogs();const provinceId=selectedId(catalogs.provinces,state.worker.province);const cityId=selectedId(citiesForProvince(provinceId),state.worker.city);const zoneId=selectedId(zonesForCity(cityId),state.worker.zone);const categoryId=selectedId(catalogs.categories,state.worker.category);const skillIds=catalogs.skills.filter(x=>state.worker.skills.includes(x.name)).map(x=>x.id);openModal('Editar perfil',`<label>Foto de perfil<input id="p-photo" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewProfileImage(this)"></label><div id="profile-photo-preview" class="image-preview">${state.worker.photo?`<img src="${esc(state.worker.photo)}" alt="Foto actual">`:''}</div><label>Nombre<input id="p-name" value="${esc(state.worker.name)}"></label><label>Apellido<input id="p-surname" value="${esc(state.worker.surname)}"></label><label>Provincia<select id="p-province" onchange="refreshProfileLocations()">${optionList(catalogs.provinces,provinceId)}</select></label><label>Ciudad<select id="p-city" onchange="refreshProfileZones()">${optionList(citiesForProvince(provinceId),cityId)}</select></label><label>Zona<select id="p-zone">${optionList(zonesForCity(cityId),zoneId,'Zona aproximada')}</select></label><label>Categoría<select id="p-category" onchange="refreshProfileSkills()">${optionList(catalogs.categories,categoryId)}</select></label><label>Habilidades <select id="p-skills" multiple>${catalogs.skills.filter(x=>!categoryId||x.category_id===categoryId).map(x=>`<option value="${esc(x.id)}" ${skillIds.includes(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select><small>Podés seleccionar varias.</small></label><label>Movilidad<select id="p-mobility"><option value="">Elegir</option><option ${state.worker.mobility==='Transporte público'?'selected':''}>Transporte público</option><option ${state.worker.mobility==='Bicicleta'?'selected':''}>Bicicleta</option><option ${state.worker.mobility==='Moto'?'selected':''}>Moto</option><option ${state.worker.mobility==='Auto'?'selected':''}>Auto</option><option ${state.worker.mobility==='A pie'?'selected':''}>A pie</option></select></label><label>Presentación<textarea id="p-bio">${esc(state.worker.bio)}</textarea></label><label>Experiencia<textarea id="p-exp">${esc(state.worker.experience)}</textarea></label><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveWorkerProfile()">Guardar cambios</button></div>`)}
function refreshProfileLocations(){const provinceId=document.querySelector('#p-province')?.value||'';const city=document.querySelector('#p-city');if(city)city.innerHTML=optionList(citiesForProvince(provinceId));const zone=document.querySelector('#p-zone');if(zone)zone.innerHTML=optionList([], '', 'Elegí primero una ciudad')}

function previewProfileImage(input){const file=input?.files?.[0];const box=document.querySelector('#profile-photo-preview');if(!box)return;if(!file){box.innerHTML='';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)){input.value='';return toast('Usá JPG, PNG o WebP')}if(file.size>5*1024*1024){input.value='';return toast('La imagen no puede superar 5 MB')}const url=URL.createObjectURL(file);box.innerHTML=`<img src=\"${url}\" alt=\"Vista previa\">`;}
async function uploadProfileImage(file,role){if(!sb||!state.authUser||!file)return null;if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Formato de imagen no permitido');if(file.size>5*1024*1024)throw new Error('La imagen no puede superar 5 MB');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=`${state.authUser.id}/${role}-${Date.now()}.${ext}`;const {error}=await sb.storage.from('profile-images').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;const {data}=sb.storage.from('profile-images').getPublicUrl(path);return data.publicUrl;}
async function saveWorkerProfile(){
 const name=document.querySelector('#p-name')?.value?.trim()||'', surname=document.querySelector('#p-surname')?.value?.trim()||'', city=document.querySelector('#p-city')?.value?.trim()||'', zone=document.querySelector('#p-zone')?.value?.trim()||'', category=document.querySelector('#p-category')?.value||'', mobility=document.querySelector('#p-mobility')?.value||'', bio=document.querySelector('#p-bio')?.value?.trim()||'', experience=document.querySelector('#p-exp')?.value?.trim()||'';
 if(!sb||!state.authUser)return showLogin();
 const {data:wp,error:we}=await sb.from('worker_profiles').select('id').eq('user_id',state.authUser.id).maybeSingle(); if(we)return toast(we.message);
 let workerId=wp?.id;
 if(!workerId){const {data:created,error}=await sb.from('worker_profiles').insert({user_id:state.authUser.id,first_name:name,last_name:surname,bio,experience_description:experience,experience_years:Number(experience.match(/\d+(?:[.,]\d+)?/)?.[0]?.replace(',','.')||0),contact_permission:state.worker.contact,public_zone_only:true}).select('id').single();if(error)return toast(error.message);workerId=created.id}
 const lookup=async(table,col,value)=>{if(!value)return null;const {data}=await sb.from(table).select('id').ilike(col,value).limit(1).maybeSingle();return data?.id||null};
 const provinceId=document.querySelector('#p-province')?.value||null;
 const cityId=document.querySelector('#p-city')?.value||null;
 const zoneId=document.querySelector('#p-zone')?.value||null;
 const categoryId=document.querySelector('#p-category')?.value||null;const selectedSkillIds=[...document.querySelector('#p-skills')?.selectedOptions||[]].map(o=>o.value).filter(Boolean);
 let photoUrl=state.worker.photo||'';const photoFile=document.querySelector('#p-photo')?.files?.[0];if(photoFile){try{photoUrl=await uploadProfileImage(photoFile,'worker')}catch(e){return toast(e.message||'No se pudo subir la imagen')}} const {error}=await sb.from('worker_profiles').update({first_name:name,last_name:surname,bio,experience_description:experience,experience_years:Number(experience.match(/\d+(?:[.,]\d+)?/)?.[0]?.replace(',','.')||0),province_id:provinceId,city_id:cityId,zone_id:zoneId,mobility:{selected:mobility},contact_permission:state.worker.contact,public_zone_only:true,photo_url:photoUrl||null}).eq('id',workerId); if(error)return toast(error.message);
 const {error:deleteCategoryError}=await sb.from('worker_categories').delete().eq('worker_id',workerId);if(deleteCategoryError)return toast(deleteCategoryError.message);if(categoryId){const {error:ce}=await sb.from('worker_categories').insert({worker_id:workerId,category_id:categoryId});if(ce)return toast(ce.message)}const {error:deleteSkillsError}=await sb.from('worker_skills').delete().eq('worker_id',workerId);if(deleteSkillsError)return toast(deleteSkillsError.message);if(selectedSkillIds.length){const {error:se}=await sb.from('worker_skills').insert(selectedSkillIds.map(skill_id=>({worker_id:workerId,skill_id})));if(se)return toast(se.message)}
 const provinceName=catalogs.provinces.find(x=>x.id===provinceId)?.name||'';const cityName=catalogs.cities.find(x=>x.id===cityId)?.name||'';const zoneName=catalogs.zones.find(x=>x.id===zoneId)?.name||'';const categoryName=catalogs.categories.find(x=>x.id===categoryId)?.name||'';const skillNames=catalogs.skills.filter(x=>selectedSkillIds.includes(x.id)).map(x=>x.name);state.worker={...state.worker,name,surname,province:provinceName,city:cityName,zone:zoneName,category:categoryName,skills:skillNames,mobility,bio,experience};closeModal();await loadWorkerProfile();render();toast('Perfil guardado correctamente')
}
async function loadNotifications(){if(!sb||!state.authUser)return;const {data,error}=await sb.rpc('get_my_notifications',{p_limit:50});if(error)return;state.notifications=(data||[]).map(n=>({id:n.id,title:n.title||'Notificación',message:n.message||'',time:n.created_at?new Date(n.created_at).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'',unread:!n.read_at}));}
async function loadWorkerProfile(){if(!sb||!state.authUser)return;const {data:p}=await sb.from('worker_profiles').select('*,provinces(name),cities(name),zones(name)').eq('user_id',state.authUser.id).maybeSingle();if(!p)return;const [cats,skills,av]=await Promise.all([sb.from('worker_categories').select('category_id,categories(name)').eq('worker_id',p.id),sb.from('worker_skills').select('skill_id,skills(name)').eq('worker_id',p.id),sb.from('availability').select('*').eq('worker_id',p.id).eq('is_active',true).order('created_at',{ascending:false}).limit(1).maybeSingle()]);state.worker={...state.worker,name:p.first_name||'',surname:p.last_name||'',photo:p.photo_url||'',bio:p.bio||'',experience:p.experience_description||'',completion:p.profile_completion||0,contact:p.contact_permission!==false,province:p.provinces?.name||'',city:p.cities?.name||'',zone:p.zones?.name||'',mobility:p.mobility?.selected||'',category:cats.data?.[0]?.categories?.name||'',skills:(skills.data||[]).map(x=>x.skills?.name).filter(Boolean),availability:av.data?.availability_type?({'now':'Disponible ahora','today':'Disponible hoy','tomorrow':'Disponible mañana','this_week':'Esta semana','weekends':'Fin de semana'}[av.data.availability_type]||'No disponible'):'No disponible'};}

async function openBusinessProfile(){await loadCatalogs();const provinceId=selectedId(catalogs.provinces,state.business.province);const cityId=selectedId(citiesForProvince(provinceId),state.business.city);const zoneId=selectedId(zonesForCity(cityId),state.business.zone);const categoryId=selectedId(catalogs.categories,state.business.category);openModal('Perfil del negocio',`<label>Logo / imagen del negocio<input id="b-photo" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewProfileImage(this)"></label><div id="profile-photo-preview" class="image-preview">${state.business.logo?`<img src="${esc(state.business.logo)}" alt="Logo actual">`:''}</div><label>Nombre del negocio<input id="b-name" value="${esc(state.business.name)}"></label><label>Categoría<select id="b-cat">${optionList(catalogs.categories,categoryId)}</select></label><label>Provincia<select id="b-prov" onchange="refreshBusinessLocations()">${optionList(catalogs.provinces,provinceId)}</select></label><label>Ciudad<select id="b-city" onchange="refreshBusinessZones()">${optionList(citiesForProvince(provinceId),cityId)}</select></label><label>Zona<select id="b-zone">${optionList(zonesForCity(cityId),zoneId,'Zona aproximada')}</select></label><label>Descripción<textarea id="b-desc">${esc(state.business.description)}</textarea></label><label>Dirección<input id="b-address" value="${esc(state.business.address)}"></label><label>Web<input id="b-web" value="${esc(state.business.website)}"></label><label>Instagram<input id="b-inst" value="${esc(state.business.instagram)}"></label><label>Horarios<textarea id="b-hours">${esc(state.business.hours)}</textarea></label><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveBusinessProfile()">Guardar cambios</button></div>`)}

async function saveBusinessProfile(){
 const b={name:document.querySelector('#b-name')?.value?.trim()||'',category:document.querySelector('#b-cat')?.value||'',province:document.querySelector('#b-prov')?.value?.trim()||'',city:document.querySelector('#b-city')?.value?.trim()||'',zone:document.querySelector('#b-zone')?.value?.trim()||'',description:document.querySelector('#b-desc')?.value?.trim()||'',address:document.querySelector('#b-address')?.value?.trim()||'',website:document.querySelector('#b-web')?.value?.trim()||'',instagram:document.querySelector('#b-inst')?.value?.trim()||'',hours:document.querySelector('#b-hours')?.value?.trim()||''};

 const {data:bp,error:be}=await sb.from('business_profiles').select('id').eq('user_id',state.authUser.id).maybeSingle();if(be)return toast(be.message);let id=bp?.id;
 const lookup=async(table,col,value)=>{if(!value)return null;const {data}=await sb.from(table).select('id').ilike(col,value).limit(1).maybeSingle();return data?.id||null};
 const provinceId=document.querySelector('#b-prov')?.value||null, cityId=document.querySelector('#b-city')?.value||null, zoneId=document.querySelector('#b-zone')?.value||null, categoryId=document.querySelector('#b-cat')?.value||null;

 let r=id?await sb.from('business_profiles').update(payload).eq('id',id):await sb.from('business_profiles').insert(payload);if(r.error)return toast(r.error.message);state.business={...b,logo:logoUrl||state.business.logo,province:catalogs.provinces.find(x=>x.id===provinceId)?.name||'',city:catalogs.cities.find(x=>x.id===cityId)?.name||'',zone:catalogs.zones.find(x=>x.id===zoneId)?.name||'',category:catalogs.categories.find(x=>x.id===categoryId)?.name||''};closeModal();render();toast('Perfil de negocio guardado')

function openAvailability(note=''){const selected=state.worker._pendingAvailability||state.worker.availability;openModal('Mi disponibilidad',`<div class="availability-options">${['Disponible ahora','Disponible hoy','Disponible mañana','Esta semana','Fin de semana','No disponible'].map(x=>`<button class="availability-option ${selected===x?'selected':''}" onclick="setAvailability('${x}')"><span>${x==='No disponible'?'○':'●'}</span>${x}<i>›</i></button>`).join('')}</div><label>Nota opcional<textarea id="avail-note" placeholder="Ej.: disponible para turno noche">${esc(note)}</textarea></label><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveAvailability()">Guardar</button></div>`)}
function setAvailability(v){const note=document.querySelector('#avail-note')?.value||'';state.worker._pendingAvailability=v;openAvailability(note)}
async function saveAvailability(){const label=state.worker._pendingAvailability||state.worker.availability;delete state.worker._pendingAvailability;if(!sb||!state.authUser)return showLogin();const map={'Disponible ahora':'now','Disponible hoy':'today','Disponible mañana':'tomorrow','Esta semana':'this_week','Fin de semana':'weekends'};if(label==='No disponible'){const {error}=await sb.rpc('disable_worker_availability');if(error)return toast(error.message)}else{const now=new Date();const starts=new Date(now);let expires=new Date(now);if(label==='Disponible ahora'){expires.setHours(23,59,59,999)}else if(label==='Disponible hoy'){expires.setHours(23,59,59,999)}else if(label==='Disponible mañana'){starts.setDate(starts.getDate()+1);starts.setHours(0,0,0,0);expires=new Date(starts);expires.setHours(23,59,59,999)}else if(label==='Esta semana'){expires.setDate(expires.getDate()+7)}else if(label==='Fin de semana'){const daysUntilSaturday=(6-now.getDay()+7)%7;starts.setDate(starts.getDate()+daysUntilSaturday);starts.setHours(0,0,0,0);expires=new Date(starts);expires.setDate(expires.getDate()+1);expires.setHours(23,59,59,999)}const {error}=await sb.rpc('set_worker_availability',{p_availability_type:map[label],p_starts_at:starts.toISOString(),p_expires_at:expires.toISOString(),p_notes:document.querySelector('#avail-note')?.value||null});if(error)return toast(error.message)}state.worker.availability=label;closeModal();render();toast('Disponibilidad actualizada')}
function openBoost(){openModal('Destacarme',`<p class="muted">El boost aumenta visibilidad, pero nunca reemplaza la relevancia, disponibilidad o coincidencia por zona.</p><div class="boost-option"><div><b>24 horas</b><span>Visibilidad destacada durante 24 h</span></div><strong>24 h</strong><button class="primary" onclick="requestBoost('24 horas')">Elegir</button></div><div class="boost-option"><div><b>7 días</b><span>Visibilidad destacada durante 7 días</span></div><strong>7 d</strong><button class="primary" onclick="requestBoost('7 días')">Elegir</button></div>`)}
async function requestBoost(t){if(!sb||!state.authUser)return showLogin();const {data:wp}=await sb.from('worker_profiles').select('id').eq('user_id',state.authUser.id).maybeSingle();if(!wp)return toast('Primero completá tu perfil de trabajador');const type=t==='24 horas'?'24_hours':'featured_7_days';const {error}=await sb.rpc('request_boost',{p_worker_id:wp.id,p_boost_type:type});if(error)return toast(error.message);closeModal();toast(`Boost de ${t} solicitado`) }
async function openReputation(){if(!sb||!state.authUser)return showLogin();const {data,error}=await sb.from('reviews').select('rating,comment,status,created_at').eq('reviewed_user_id',state.authUser.id).eq('status','published').order('created_at',{ascending:false});if(error)return toast(error.message);const rows=data||[];const avg=rows.length?(rows.reduce((a,r)=>a+Number(r.rating||0),0)/rows.length).toFixed(1):'Nuevo';openModal('Mi reputación',`<div class="rating-big">★ <strong>${esc(avg)}</strong></div><p class="muted">${rows.length?`${rows.length} reseña${rows.length===1?'':'s'} publicada${rows.length===1?'':'s'}.`:'Todavía no tenés reseñas publicadas.'}</p><div class="cards-list">${rows.map(r=>`<div class="info-card"><b>⭐ ${r.rating}/5</b><p>${esc(r.comment||'Sin comentario')}</p></div>`).join('')||empty('Sin reseñas','La reputación aparece después de interacciones reales.')}</div>`)}
async function openFilters(){await loadCatalogs();const provinceId=selectedId(catalogs.provinces,state.filters.province);const cityId=selectedId(citiesForProvince(provinceId),state.filters.city);const zoneId=selectedId(zonesForCity(cityId),state.filters.zone);const categoryId=selectedId(catalogs.categories,state.filters.category);const skillId=selectedId(catalogs.skills,state.filters.skill);openModal('Filtros de búsqueda',`<label>Disponibilidad<select id="f-av"><option value="">Cualquiera</option><option ${state.filters.availability==='Disponible ahora'?'selected':''}>Disponible ahora</option><option ${state.filters.availability==='Disponible hoy'?'selected':''}>Disponible hoy</option><option ${state.filters.availability==='Disponible mañana'?'selected':''}>Disponible mañana</option><option ${state.filters.availability==='Esta semana'?'selected':''}>Esta semana</option><option ${state.filters.availability==='Fin de semana'?'selected':''}>Fin de semana</option></select></label><div class="grid two"><label>Provincia<select id="f-prov" onchange="refreshFilterLocations()">${optionList(catalogs.provinces,provinceId,'Todas')}</select></label><label>Ciudad<select id="f-city" onchange="refreshFilterZones()">${optionList(citiesForProvince(provinceId),cityId,'Todas')}</select></label><label>Zona<select id="f-zone">${optionList(zonesForCity(cityId),zoneId,'Todas')}</select></label><label>Categoría<select id="f-cat" onchange="refreshFilterSkills()">${optionList(catalogs.categories,categoryId,'Todas')}</select></label><label>Skill<select id="f-skill">${optionList(catalogs.skills.filter(x=>!categoryId||x.category_id===categoryId),skillId,'Todas')}</select></label><label>Experiencia<select id="f-exp"><option value="">Cualquiera</option><option ${state.filters.experience==='1+ año'?'selected':''}>1+ año</option><option ${state.filters.experience==='3+ años'?'selected':''}>3+ años</option><option ${state.filters.experience==='5+ años'?'selected':''}>5+ años</option></select></label><label>Movilidad<select id="f-mob"><option value="">Cualquiera</option><option ${state.filters.mobility==='A pie'?'selected':''}>A pie</option><option ${state.filters.mobility==='Bicicleta'?'selected':''}>Bicicleta</option><option ${state.filters.mobility==='Moto'?'selected':''}>Moto</option><option ${state.filters.mobility==='Auto'?'selected':''}>Auto</option><option ${state.filters.mobility==='Transporte público'?'selected':''}>Transporte público</option></select></label></div><div class="modal-actions"><button class="secondary" onclick="clearFilters()">Limpiar</button><button class="primary" onclick="applyFilters()">Aplicar filtros</button></div>`)}
function refreshFilterLocations(){const provinceId=document.querySelector('#f-prov')?.value||'';const city=document.querySelector('#f-city');if(city)city.innerHTML=optionList(citiesForProvince(provinceId),'','Todas');const zone=document.querySelector('#f-zone');if(zone)zone.innerHTML=optionList([], '', 'Elegí primero una ciudad')}
function refreshFilterZones(){const cityId=document.querySelector('#f-city')?.value||'';const zone=document.querySelector('#f-zone');if(zone)zone.innerHTML=optionList(zonesForCity(cityId),'','Todas')}
function refreshFilterSkills(){const categoryId=document.querySelector('#f-cat')?.value||'';const skill=document.querySelector('#f-skill');if(skill)skill.innerHTML=optionList(catalogs.skills.filter(x=>!categoryId||x.category_id===categoryId),'','Todas')}
function applyFilters(){const pid=document.querySelector('#f-prov')?.value||'',cid=document.querySelector('#f-city')?.value||'',zid=document.querySelector('#f-zone')?.value||'',catid=document.querySelector('#f-cat')?.value||'',sid=document.querySelector('#f-skill')?.value||'';state.filters={availability:document.querySelector('#f-av').value,province:catalogs.provinces.find(x=>x.id===pid)?.name||'',city:catalogs.cities.find(x=>x.id===cid)?.name||'',zone:catalogs.zones.find(x=>x.id===zid)?.name||'',category:catalogs.categories.find(x=>x.id===catid)?.name||'',experience:document.querySelector('#f-exp').value,mobility:document.querySelector('#f-mob').value,skill:catalogs.skills.find(x=>x.id===sid)?.name||''};closeModal();state.screen='search';runSearch()}
function clearFilters(){state.filters={availability:'',category:'',province:'',city:'',zone:'',experience:'',mobility:'',skill:''};closeModal();toast('Filtros limpiados');runSearch()}
function filterWorkers(list){return list.filter(w=>{const f=state.filters;return(!f.category||w.category===f.category)&&(!f.zone||w.zone.toLowerCase().includes(f.zone.toLowerCase()))&&(!f.city||w.city.toLowerCase().includes(f.city.toLowerCase()))&&(!f.mobility||w.mobility===f.mobility)&&(!f.skill||w.skills.some(s=>s.toLowerCase().includes(f.skill.toLowerCase())))&&(!f.availability||w.availability===f.availability)}).filter(w=>!document.querySelector('#search-q')||!document.querySelector('#search-q').value||`${w.name} ${w.category} ${w.skills.join(' ')}`.toLowerCase().includes(document.querySelector('#search-q').value.toLowerCase()))}
async function runSearch(type=''){if(type==='now')state.filters.availability='Disponible ahora';state.screen='search';if(sb&&state.role==='business'){const f=state.filters;const availabilityMap={'Disponible ahora':'now','Disponible hoy':'today','Disponible mañana':'tomorrow','Esta semana':'this_week','Fin de semana':'weekends'};const lookup=async(table,col,value)=>{if(!value)return null;const {data}=await sb.from(table).select('id').ilike(col,value).limit(1).maybeSingle();return data?.id||null};const [provinceId,cityId,zoneId,categoryId,skillId]=await Promise.all([lookup('provinces','name',f.province),lookup('cities','name',f.city),lookup('zones','name',f.zone),lookup('categories','name',f.category),lookup('skills','name',f.skill)]);const queryInput=document.querySelector('#quick-search')||document.querySelector('#search-q');const query=queryInput?queryInput.value.trim():(state.searchQuery||'');state.searchQuery=query;const exp=f.experience==='1+ año'?1:f.experience==='3+ años'?3:f.experience==='5+ años'?5:null;const {data,error}=await sb.rpc('search_workers',{p_province_id:provinceId,p_city_id:cityId,p_zone_id:zoneId,p_category_id:categoryId,p_skill_id:skillId,p_availability:availabilityMap[f.availability]||null,p_min_experience:exp,p_mobility:f.mobility||null,p_query:query,p_limit:50,p_offset:0});if(error)return toast(error.message);const rows=data||[];const ids=rows.map(w=>w.worker_id);let meta={};if(ids.length){const [cats,skills,profiles]=await Promise.all([sb.from('worker_categories').select('worker_id,categories(name)').in('worker_id',ids),sb.from('worker_skills').select('worker_id,skills(name)').in('worker_id',ids),sb.from('worker_profiles').select('id,provinces(name),cities(name),zones(name)').in('id',ids)]);const catMap={};(cats.data||[]).forEach(x=>{if(!catMap[x.worker_id])catMap[x.worker_id]=[];if(x.categories?.name)catMap[x.worker_id].push(x.categories.name)});const skillMap={};(skills.data||[]).forEach(x=>{if(!skillMap[x.worker_id])skillMap[x.worker_id]=[];if(x.skills?.name)skillMap[x.worker_id].push(x.skills.name)});(profiles.data||[]).forEach(x=>{meta[x.id]={category:catMap[x.id]?.[0]||'',skills:skillMap[x.id]||[],zone:x.zones?.name||'Zona aproximada',city:x.cities?.name||'',province:x.provinces?.name||''}})}state.realWorkers=rows.map(w=>({id:w.worker_id,name:`${w.first_name||''} ${w.last_name||''}`.trim(),initial:(w.first_name||'P')[0],availability:{now:'Disponible ahora',today:'Disponible hoy',tomorrow:'Disponible mañana',this_week:'Esta semana',weekends:'Fin de semana'}[w.availability_type]||'Disponible',zone:meta[w.worker_id]?.zone||'Zona aproximada',city:meta[w.worker_id]?.city||'',category:meta[w.worker_id]?.category||'',skills:meta[w.worker_id]?.skills||[],experience:`${w.experience_years||0} años`,mobility:w.mobility?.selected||'Ver perfil',rating:w.rating_average||'Nuevo',reviews:w.rating_count||0,featured:!!w.is_featured,bio:w.bio||''}));}render()}
async function viewWorker(id){let w=null;if(sb&&state.authUser&&state.role==='business'&&/^[0-9a-f-]{36}$/i.test(id)){const {data:p,error}=await sb.from('worker_profiles').select('id,user_id,first_name,last_name,photo_url,bio,experience_years,experience_description,mobility,profile_completion,rating_average,rating_count,provinces(name),cities(name),zones(name)').eq('id',id).maybeSingle();if(error)return toast(error.message);if(!p)return toast('No encontramos este perfil');const [cat,skills,av,reviews]=await Promise.all([sb.from('worker_categories').select('categories(name)').eq('worker_id',id),sb.from('worker_skills').select('skills(name)').eq('worker_id',id),sb.from('availability').select('availability_type').eq('worker_id',id).eq('is_active',true).order('created_at',{ascending:false}).limit(1).maybeSingle(),sb.from('reviews').select('rating,comment,created_at').eq('reviewed_user_id',p.user_id).eq('status','published').order('created_at',{ascending:false}).limit(5)]);w={id,userId:p.user_id,photo:p.photo_url||'',name:`${p.first_name||''} ${p.last_name||''}`.trim(),initial:(p.first_name||'P')[0],availability:{now:'Disponible ahora',today:'Disponible hoy',tomorrow:'Disponible mañana',this_week:'Esta semana',weekends:'Fin de semana'}[av.data?.availability_type]||'No disponible',zone:p.zones?.name||'Zona aproximada',city:p.cities?.name||'',category:cat.data?.[0]?.categories?.name||'',skills:(skills.data||[]).map(x=>x.skills?.name).filter(Boolean),experience:`${p.experience_years||0} años`,mobility:p.mobility?.selected||'No especificada',rating:p.rating_count?p.rating_average:'Nuevo',reviews:p.rating_count||0,featured:false,bio:p.bio||p.experience_description||'',publishedReviews:reviews.data||[]};}if(!w)return;openModal('Perfil del trabajador',`<div class="worker-detail"><div class="big-avatar">${w.photo?`<img src="${esc(w.photo)}" alt="Foto de ${esc(w.name)}">`:w.initial}</div><span class="featured">${w.featured?'DESTACADO':'PERFIL'}</span><h2>${esc(w.name)}</h2><p class="available-text">● ${esc(w.availability)}</p><p class="muted">${esc(w.category)} · ${esc(w.zone)}, ${esc(w.city)}</p><div class="detail-grid"><div><small>Experiencia</small><b>${esc(w.experience)}</b></div><div><small>Movilidad</small><b>${esc(w.mobility)}</b></div><div><small>Reputación</small><b>⭐ ${esc(w.rating)}</b></div><div><small>Reseñas</small><b>${w.reviews}</b></div></div><h3>Sobre mí</h3><p>${esc(w.bio||'Sin presentación todavía.')}</p><h3>Habilidades</h3><div class="worker-tags">${w.skills.map(s=>`<span>${esc(s)}</span>`).join('')||'<span>Sin habilidades cargadas</span>'}</div><h3>Últimas reseñas</h3><div class="cards-list">${w.publishedReviews?.length?w.publishedReviews.map(r=>`<div class="info-card"><b>⭐ ${Number(r.rating)||0}/5</b><p>${esc(r.comment||'Sin comentario')}</p></div>`).join(''):empty('Sin reseñas publicadas','Las reseñas aparecen después de experiencias reales.')}</div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cerrar</button><button class="secondary" onclick="openReport('${w.userId||''}')">Reportar</button><button class="secondary" onclick="blockUser('${w.userId||''}')">Bloquear</button><button class="primary" onclick="contactWorker('${w.id}')">Contactar por WhatsApp</button><button class="secondary" onclick="openReview('${w.userId||''}',${jsArg(w.name)})">Calificar</button></div>`)}
async function contactWorker(id){if(!sb||!state.authUser)return showLogin();const {data,error}=await sb.rpc('start_worker_contact',{p_worker_id:id});if(error)return toast(error.message);const contact=Array.isArray(data)?data[0]:data;closeModal();if(contact?.whatsapp_url)location.href=contact.whatsapp_url;else toast('Contacto registrado, pero no se recibió un enlace de WhatsApp.')}
async function toggleFavorite(id){if(!sb||!state.authUser)return showLogin();const {data:bp}=await sb.from('business_profiles').select('id').eq('user_id',state.authUser.id).maybeSingle();if(!bp)return toast('Primero completá tu perfil de negocio');const exists=await sb.from('favorites').select('id').eq('business_id',bp.id).eq('worker_id',id).maybeSingle();if(exists.data){const {error}=await sb.from('favorites').delete().eq('id',exists.data.id);if(error)return toast(error.message);state.favorites=state.favorites.filter(x=>x!==id);toast('Quitado de Mis candidatos')}else{const {error}=await sb.from('favorites').insert({business_id:bp.id,worker_id:id});if(error)return toast(error.message);state.favorites=[...state.favorites,id];toast('Guardado en Mis candidatos')}await loadSavedWorkers();render()}
async function markAllRead(){if(sb&&state.authUser){const {error}=await sb.rpc('mark_all_notifications_read');if(error)return toast(error.message)}state.notifications.forEach(n=>n.unread=false);render();toast('Notificaciones leídas')}
async function readNotification(i){const n=state.notifications[i];if(sb&&state.authUser&&n?.id){const {error}=await sb.rpc('mark_notification_read',{p_notification_id:n.id});if(error)return toast(error.message)}if(n)n.unread=false;render()}
function openAccountSettings(){const p=state.role==='worker'?state.worker:state.business;const contact=!!p.contact;const status=state.accountStatus||'active';openModal('Cuenta y privacidad',`<div class="settings-list"><div><b>Permitir nuevos contactos</b><span>${state.role==='worker'?'Los negocios pueden solicitar contacto.':'Podés recibir contactos de trabajadores.'}</span><button class="toggle ${contact?'on':''}" onclick="setContactPermission(${!contact})"><i></i></button></div><div><b>Mostrar solo zona aproximada</b><span>La ubicación exacta nunca es pública.</span><button class="toggle on"><i></i></button></div><div><b>Estado de cuenta</b><span>${status==='paused'?'Pausada':'Activa'}</span><button class="secondary" onclick="${status==='paused'?'resumeAccount()':'pauseAccount()'}">${status==='paused'?'Reactivar':'Pausar'}</button></div></div>`)}
async function setContactPermission(value){if(!sb||!state.authUser)return;const table=state.role==='worker'?'worker_profiles':'business_profiles';const {error}=await sb.from(table).update({contact_permission:value}).eq('user_id',state.authUser.id);if(error)return toast(error.message);if(state.role==='worker')state.worker.contact=value;else state.business.contact=value;openAccountSettings();toast(value?'Nuevos contactos permitidos':'Nuevos contactos bloqueados')}
async function blockUser(userId){if(!sb||!state.authUser||!userId)return toast('No se pudo identificar al usuario');const {error}=await sb.rpc('block_user',{p_user_id:userId});if(error)return toast(error.message);closeModal();toast('Usuario bloqueado')}
function openReport(userId){if(!sb||!state.authUser||!userId)return toast('No se pudo identificar al usuario');openModal('Reportar usuario',`<label>Motivo<select id="report-reason"><option>spam</option><option>acoso</option><option>perfil falso</option><option>información engañosa</option><option>comportamiento inapropiado</option><option>otro</option></select></label><label>Detalle opcional<textarea id="report-desc" placeholder="Contanos qué pasó"></textarea></label><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="danger-btn" onclick="submitReport('${userId}')">Enviar reporte</button></div>`)}
async function submitReport(userId){const {error}=await sb.rpc('submit_report',{p_reported_user_id:userId,p_reason:document.querySelector('#report-reason')?.value,p_description:document.querySelector('#report-desc')?.value?.trim()||null});if(error)return toast(error.message);closeModal();toast('Reporte enviado para revisión')}
function openReview(userId,name){if(!sb||!state.authUser||!userId)return;openModal('Calificar experiencia',`<p class="muted">Tu experiencia con ${esc(name)} será moderada antes de publicarse.</p><label>Puntuación<select id="review-rating"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select></label><label>Comentario opcional<textarea id="review-comment"></textarea></label><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="submitReview('${userId}')">Enviar reseña</button></div>`)}
async function submitReview(userId){const {error}=await sb.rpc('submit_review',{p_reviewed_user_id:userId,p_rating:Number(document.querySelector('#review-rating')?.value),p_comment:document.querySelector('#review-comment')?.value?.trim()||null});if(error)return toast(error.message);closeModal();toast('Reseña enviada para moderación')}
async function setAccountStatus(status){if(!sb||!state.authUser)return showLogin();const {error}=await sb.rpc('set_my_account_status',{p_status:status});if(error)return toast(error.message);state.accountStatus=status;if(status==='paused'){state.worker.availability='No disponible';state.business.status='paused';}closeModal();if(status==='paused'){toast('Cuenta pausada. Podés reactivarla cuando quieras.')}else{toast('Cuenta reactivada.');}render()}
function pauseAccount(){openModal('Pausar cuenta',`<div class="danger-box"><b>¿Querés pausar tu cuenta?</b><p>Tu perfil dejará de estar disponible para nuevas búsquedas mientras esté pausado.</p></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="setAccountStatus('paused')">Pausar cuenta</button></div>`)}
function resumeAccount(){setAccountStatus('active')}
function openSafety(){openModal('Seguridad y reportes',`<div class="settings-list"><button onclick="openBlockedUsers()"><b>🚫 Usuarios bloqueados</b><span>Gestionar bloqueos</span></button><button onclick="closeModal();toast('Para reportar un perfil, abrí su ficha y elegí Reportar.')"><b>⚑ Reportar un problema</b><span>Spam, acoso, perfil falso, información engañosa u otro</span></button><div><b>🔒 Seguridad</b><span>No mostramos direcciones exactas ni datos de contacto cuando el usuario no los autoriza.</span></div></div>`)}
async function openBlockedUsers(){if(!sb||!state.authUser)return;const {data,error}=await sb.from('blocks').select('id,blocked_user_id,created_at').eq('blocker_user_id',state.authUser.id).order('created_at',{ascending:false});if(error)return toast(error.message);if(!(data||[]).length)return openModal('Usuarios bloqueados',empty('No hay bloqueos','Todavía no bloqueaste a ningún usuario.'));const ids=data.map(x=>x.blocked_user_id);const {data:users}=await sb.from('users').select('id,email').in('id',ids);const names=Object.fromEntries((users||[]).map(u=>[u.id,u.email||'Usuario']));openModal('Usuarios bloqueados',`<div class="settings-list">${data.map(x=>`<div><b>${esc(names[x.blocked_user_id]||'Usuario')}</b><button class="secondary" onclick="unblockUser('${x.blocked_user_id}')">Desbloquear</button></div>`).join('')}</div>`)}
async function unblockUser(userId){const {error}=await sb.rpc('unblock_user',{p_user_id:userId});if(error)return toast(error.message);openBlockedUsers();toast('Usuario desbloqueado')}
function openTerms(){openModal('Términos y privacidad',`<div class="info-card"><h3>Términos de uso</h3><p>DISPONIBLE conecta personas disponibles con negocios que necesitan personal. La plataforma no es empleadora, no garantiza contratación y no administra el pago del trabajo realizado.</p><p>Los usuarios deben proporcionar información verdadera, respetar a otros usuarios y utilizar la plataforma de forma lícita.</p></div><div class="info-card"><h3>Privacidad</h3><p>La ubicación pública se limita a una zona aproximada. Los datos de contacto se utilizan según los permisos configurados y las funciones de la plataforma.</p></div>`)}
function confirmDelete(){openModal('Eliminar cuenta',`<div class="danger-box"><b>La cuenta dejará de estar activa.</b><p>Tu perfil se marcará como eliminado y dejará de aparecer en nuevas búsquedas. La eliminación física de credenciales se gestiona posteriormente mediante el flujo seguro de cuenta.</p></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="danger-btn" onclick="deleteMyAccount()">Eliminar cuenta</button></div>`)}
async function deleteMyAccount(){if(!sb||!state.authUser)return showLogin();const {error}=await sb.rpc('set_my_account_status',{p_status:'deleted'});if(error)return toast(error.message);toast('Cuenta eliminada del sistema DISPONIBLE.');await logout()}
function empty(title,text){return `<div class="empty"><div>⌁</div><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`}
function navigate(k){const allowed=['home','search','saved','notifications','profile'];if(!allowed.includes(k))return;if(!state.authUser||!['worker','business'].includes(state.role)){render();return;}if(state.role==='worker'&&k==='saved'){toast('Candidatos está disponible para cuentas de negocio.');return;}state.screen=k;closeModal();render();window.scrollTo({top:0,behavior:'auto'});}
function goBack(){state.screen='home';render()}
function openMenu(){openModal('Menú',`<div class="menu-list"><button onclick="navigate('profile');closeModal()">👤 Mi perfil</button><button onclick="navigate('notifications');closeModal()">🔔 Notificaciones</button><button onclick="openTerms()">ⓘ Términos y privacidad</button><button onclick="logout();closeModal()">↪ Cerrar sesión</button></div>`)}
function openModal(title,body){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="modal-card"><div class="modal-head"><div><span class="eyebrow">DISPONIBLE</span><h2>${esc(title)}</h2></div><button class="icon-btn" onclick="closeModal()">×</button></div>${body}</div>`;document.body.append(m)}
function closeModal(){document.querySelector('#modal')?.remove()}
render();

(async()=>{
  await syncAuth();
  render();
  if(sb)sb.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'||!session){
      authSyncVersion++;authSyncPromise=null;authReady=true;authError='';
      state.authUser=null;state.role=null;state.accountStatus='active';state.screen='home';
      state.realWorkers=[];state.savedWorkers=[];state.favorites=[];state.notifications=[];
      render();return;
    }
    if(event==='SIGNED_IN'||event==='USER_UPDATED'||event==='TOKEN_REFRESHED')setTimeout(async()=>{authSyncVersion++;authSyncPromise=null;await syncAuth();render()},0);
  });
})();

</script>
</body></html>
